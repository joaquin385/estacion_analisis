[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "estacion-universal"
version = "0.1.0"
description = "Estación Universal de Análisis de Datos — EDA, estadística y descubrimiento automático local"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Estación Universal" }]
dependencies = [
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.3.0",
  "statsmodels>=0.14.0",
  "duckdb>=0.9.0",
  "openpyxl>=3.1.0",
  "plotly>=5.18.0",
  "streamlit>=1.29.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "jinja2>=3.1.0",
  "joblib>=1.3.0",
  "networkx>=3.2.0",
]

[project.optional-dependencies]
causal = ["dowhy>=0.11", "econml>=0.15.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[project.scripts]
estacion = "app.streamlit_app:main"

[tool.setuptools.packages.find]
include = ["estacion*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
