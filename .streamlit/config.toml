[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
headingFont = "sans serif"
baseRadius = "1.1rem"
buttonRadius = "0.7rem"
borderColor = "#E5E9F0"
dataframeBorderColor = "#E5E9F0"
showWidgetBorder = true
linkColor = "#4F46E5"
codeBackgroundColor = "#F1F5F9"
# Paleta de gráficos alineada a Direction A (índigo + lilas)
chartCategoricalColors = [
  "#4F46E5",
  "#818CF8",
  "#C7D2FE",
  "#A5B4FC",
  "#6366F1",
  "#4338CA",
]
chartSequentialColors = ["#EEF2FF", "#C7D2FE", "#818CF8", "#4F46E5", "#312E81"]

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
